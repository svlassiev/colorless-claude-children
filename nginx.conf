server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Short address for the Snowy Friends game, which is hosted on Modal.
    # Temporary (302) so browsers do not cache it and the target can change.
    location = /friends {
        return 302 https://svlassiev--friends.modal.run/;
    }
    location = /friends/ {
        return 302 https://svlassiev--friends.modal.run/;
    }

    location ~* \.(css|js|json|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
